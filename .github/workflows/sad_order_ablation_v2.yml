name: Sensor Attack Detector Order Ablation V2

on:
  push:
    branches:
      - sad-v2-fixed-model
    paths:
      - '.github/workflows/sad_order_ablation_v2.yml'

jobs:
  ablation-v2:
    runs-on: ubuntu-latest
    container:
      image: px4io/px4-dev-simulation-focal:2021-09-08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Prepare environment
        run: |
          set -eux
          git tag -f v1.13.0-0.0.1-dev HEAD
          git -C platforms/nuttx/NuttX/nuttx fetch --tags --force
          python3 -m pip install --disable-pip-version-check pyulog pymavlink numpy
          make px4_sitl_default
          make px4_sitl_default sitl_gazebo

      - name: Run explicit order ablations
        run: |
          set -eux
          OUT=build/sad_order_ablation_v2
          mkdir -p "$OUT"
          BASE="--normal-scale-mean -0.33720698952674866 --normal-scale-sd 0.02 --normal-dynamic-mean 0.42821773886680603 --normal-dynamic-sd 0.05 --glrt-mean 0 --glrt-sd 1 --threshold 1000000 --cusum-drift 0.5 --consecutive 3"

          capture () {
            LABEL="$1"
            BEFORE="$2"
            AFTER=$(mktemp)
            find build/sad_v2_smoke -maxdepth 2 -name result.json -type f | sort > "$AFTER"
            RESULT=$(comm -13 "$BEFORE" "$AFTER" | tail -n 1)
            test -n "$RESULT"
            cp "$RESULT" "$OUT/${LABEL}.json"
            rm -f "$BEFORE" "$AFTER"
          }

          before () {
            F=$(mktemp)
            find build/sad_v2_smoke -maxdepth 2 -name result.json -type f 2>/dev/null | sort > "$F" || true
            echo "$F"
          }

          B=$(before)
          python3 Tools/sensor_attack_detector/run_v2_smoke.py --scenario maneuver --maneuver slalom --speed 1.8             --weight-acceleration 142.17990926253765 --weight-velocity 0.000001 --weight-position 0.000001 $BASE
          capture slalom_A "$B"

          B=$(before)
          python3 Tools/sensor_attack_detector/run_v2_smoke.py --scenario maneuver --maneuver slalom --speed 1.8             --weight-acceleration 0.000001 --weight-velocity 71.20519081577794 --weight-position 50.66817247677383 $BASE
          capture slalom_VP "$B"

          B=$(before)
          python3 Tools/sensor_attack_detector/run_v2_smoke.py --scenario maneuver --maneuver hard-turn --speed 2.2             --weight-acceleration 142.17990926253765 --weight-velocity 0.000001 --weight-position 0.000001 $BASE
          capture hard_A "$B"

          B=$(before)
          python3 Tools/sensor_attack_detector/run_v2_smoke.py --scenario maneuver --maneuver hard-turn --speed 2.2             --weight-acceleration 0.000001 --weight-velocity 71.20519081577794 --weight-position 50.66817247677383 $BASE
          capture hard_VP "$B"

          B=$(before)
          python3 Tools/sensor_attack_detector/run_v2_smoke.py --scenario pva-hover --pva-north 100 --pva-east 0 --pva-ramp 20 --pva-observation 10             --weight-acceleration 142.17990926253765 --weight-velocity 0.000001 --weight-position 0.000001 $BASE
          capture attack_A "$B"

          B=$(before)
          python3 Tools/sensor_attack_detector/run_v2_smoke.py --scenario pva-hover --pva-north 100 --pva-east 0 --pva-ramp 20 --pva-observation 10             --weight-acceleration 0.000001 --weight-velocity 71.20519081577794 --weight-position 50.66817247677383 $BASE
          capture attack_VP "$B"

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("build/sad_order_ablation_v2")
          rows=[]
          for p in sorted(root.glob("*.json")):
              if p.name=="summary.json": continue
              r=json.load(open(p)); d=r["detector"]
              rows.append({
                  "case":p.stem,
                  "weights":{
                      "A":r["parameters"]["SAD_WA"],
                      "V":r["parameters"]["SAD_WV"],
                      "P":r["parameters"]["SAD_WP"],
                  },
                  "glrt_mean":d.get("glrt_mean"),
                  "glrt_p95":d.get("glrt_p95"),
                  "glrt_max":d.get("glrt_max"),
                  "pre_attack_glrt_mean":d.get("pre_attack_glrt_mean"),
                  "post_attack_glrt_mean":d.get("post_attack_glrt_mean"),
                  "post_attack_glrt_max":d.get("post_attack_glrt_max"),
              })
          (root/"summary.json").write_text(json.dumps(rows,indent=2)+"\n")
          print(json.dumps(rows,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sad-order-ablation-v2
          path: build/sad_order_ablation_v2
          retention-days: 5
