name: Sensor Attack Detector V2 Prior Sensitivity

on:
  push:
    branches:
      - sad-v2-experiment
    paths:
      - '.github/workflows/sad_v2_prior_sensitivity.yml'

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    container:
      image: px4io/px4-dev-simulation-focal:2021-09-08
      options: --privileged
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Prepare PX4 version metadata
        run: |
          set -eux
          git tag -f v1.13.0-0.0.1-dev HEAD
          git -C platforms/nuttx/NuttX/nuttx fetch --tags --force

      - name: Install experiment dependencies
        run: |
          python3 -m pip install --disable-pip-version-check pyulog pymavlink numpy

      - name: Build PX4 and Gazebo
        run: |
          set -eux
          make px4_sitl_default
          make px4_sitl_default sitl_gazebo

      - name: Run prior-width sensitivity
        run: |
          set -eux
          OUT=build/sad_v2_prior_sensitivity
          mkdir -p "$OUT"
          AS_MU=-0.33720698952674866
          AD_MU=0.42821773886680603
          WA=121.6889877319336
          WV=60.0449333190918
          WP=43.07465362548828
          GMU=3.904375889504603
          GSD=6.555237344405137
          THR=38.22301732437985

          run_pair () {
            LABEL="$1"; AS_SD="$2"; AD_SD="$3"
            BEFORE=$(find build/sad_v2_smoke -maxdepth 2 -name result.json -type f 2>/dev/null | sort || true)

            python3 Tools/sensor_attack_detector/run_v2_smoke.py               --scenario turn --speed 1.3 --turn-duration 8               --straight-before 10 --straight-after 14               --normal-scale-mean "$AS_MU" --normal-scale-sd "$AS_SD"               --normal-dynamic-mean "$AD_MU" --normal-dynamic-sd "$AD_SD"               --weight-acceleration "$WA" --weight-velocity "$WV" --weight-position "$WP"               --glrt-mean "$GMU" --glrt-sd "$GSD" --threshold "$THR"

            TURN=$(find build/sad_v2_smoke -maxdepth 2 -path '*/turn_*/result.json' -type f | sort | tail -n 1)
            cp "$TURN" "$OUT/${LABEL}_turn.json"

            python3 Tools/sensor_attack_detector/run_v2_smoke.py               --scenario pva-hover --pva-north 100 --pva-east 0               --pva-ramp 20 --pva-observation 8               --normal-scale-mean "$AS_MU" --normal-scale-sd "$AS_SD"               --normal-dynamic-mean "$AD_MU" --normal-dynamic-sd "$AD_SD"               --weight-acceleration "$WA" --weight-velocity "$WV" --weight-position "$WP"               --glrt-mean "$GMU" --glrt-sd "$GSD" --threshold "$THR"

            ATTACK=$(find build/sad_v2_smoke -maxdepth 2 -path '*/pva-hover_*/result.json' -type f | sort | tail -n 1)
            cp "$ATTACK" "$OUT/${LABEL}_attack.json"
          }

          run_pair x1 0.02 0.05
          run_pair x2_5 0.05 0.125
          run_pair x5 0.10 0.25
          run_pair x10 0.20 0.50

          python3 - <<'PY'
          import json
          from pathlib import Path

          out = Path("build/sad_v2_prior_sensitivity")
          rows = []
          for label in ("x1", "x2_5", "x5", "x10"):
              turn = json.load(open(out / f"{label}_turn.json"))
              attack = json.load(open(out / f"{label}_attack.json"))
              rows.append({
                  "label": label,
                  "scale_sd": turn["parameters"]["SAD_AS_SD"],
                  "dynamic_sd": turn["parameters"]["SAD_AD_SD"],
                  "turn_alert_samples": turn["detector"]["alert_samples"],
                  "turn_glrt_mean": turn["detector"]["glrt_mean"],
                  "turn_glrt_max": turn["detector"]["glrt_max"],
                  "turn_scale_sd": turn["detector"]["normal_scale_all_sd"],
                  "turn_dynamic_sd": turn["detector"]["normal_dynamic_all_sd"],
                  "attack_pre_alerts": attack["detector"].get("pre_attack_alert_count"),
                  "attack_post_alerts": attack["detector"].get("post_attack_alert_count"),
                  "attack_delay_s": attack["detector"].get("first_alert_delay_s"),
                  "attack_post_glrt_mean": attack["detector"].get("post_attack_glrt_mean"),
                  "attack_post_glrt_max": attack["detector"].get("post_attack_glrt_max"),
                  "attack_scale_sd": attack["detector"]["normal_scale_all_sd"],
                  "attack_dynamic_sd": attack["detector"]["normal_dynamic_all_sd"],
              })
          (out / "summary.json").write_text(json.dumps(rows, indent=2) + "\n")
          print(json.dumps(rows, indent=2))
          PY

      - name: Upload sensitivity outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sad-v2-prior-sensitivity
          path: build/sad_v2_prior_sensitivity
          retention-days: 3
