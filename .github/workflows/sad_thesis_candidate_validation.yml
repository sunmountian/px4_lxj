name: Sensor Attack Detector Thesis Candidate Validation

on:
  push:
    branches:
      - sad-v2-fixed-model
    paths:
      - '.github/workflows/sad_thesis_candidate_validation.yml'

concurrency:
  group: sad-thesis-candidate-validation
  cancel-in-progress: true

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    container:
      image: px4io/px4-dev-simulation-focal:2021-09-08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Prepare environment
        run: |
          set -eux
          git tag -f v1.13.0-0.0.1-dev HEAD
          git -C platforms/nuttx/NuttX/nuttx fetch --tags --force
          python3 -m pip install --disable-pip-version-check pyulog pymavlink numpy
          make px4_sitl_default
          make px4_sitl_default sitl_gazebo

      - name: Validate thesis candidate
        run: |
          set -eux
          OUT=build/sad_thesis_candidate
          rm -rf build/sad_v2_smoke "$OUT"
          mkdir -p "$OUT"

          COMMON="--thr-map 0 --thr-gain 3.47118998 --drag-k 0.20 --drag-mod 0 --normal-scale-mean -0.33720698952674866 --normal-scale-sd 0.02 --normal-dynamic-mean 0.42821773886680603 --dynamic-lag 0.2 --normal-dynamic-sd 0.05 --weight-acceleration 142.17990926253765 --weight-velocity 71.20519081577794 --weight-position 50.66817247677383 --glrt-mean 0 --glrt-sd 1 --threshold 1000000 --attack-mask 7"

          run_case () {
            LABEL="$1"; shift
            MARKER=$(mktemp)
            touch "$MARKER"
            python3 Tools/sensor_attack_detector/run_v2_smoke.py "$@" $COMMON
            RESULT=$(find build/sad_v2_smoke -maxdepth 2 -name result.json -type f -newer "$MARKER" | head -n 1)
            rm -f "$MARKER"
            test -n "$RESULT"
            cp "$RESULT" "$OUT/${LABEL}.json"
          }

          run_case hover --scenario hover
          run_case turn --scenario turn --speed 1.3 --turn-duration 8 --straight-before 10 --straight-after 14
          run_case accel --scenario maneuver --maneuver accel --speed 2.2
          run_case attack_100_20 --scenario pva-hover --pva-north 100 --pva-east 0 --pva-ramp 20 --pva-observation 10
          run_case attack_100_30 --scenario pva-hover --pva-north 100 --pva-east 0 --pva-ramp 30 --pva-observation 15
          run_case attack_100_40 --scenario pva-hover --pva-north 100 --pva-east 0 --pva-ramp 40 --pva-observation 20

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("build/sad_thesis_candidate")
          rows=[]
          for p in sorted(root.glob("*.json")):
              if p.name=="summary.json":
                  continue
              r=json.load(open(p)); d=r["detector"]
              rows.append({
                  "case":p.stem,
                  "glrt_mean":d.get("glrt_mean"),
                  "glrt_p95":d.get("glrt_p95"),
                  "glrt_max":d.get("glrt_max"),
                  "cusum_max":d.get("cusum_max"),
                  "pre_attack_glrt_mean":d.get("pre_attack_glrt_mean"),
                  "post_attack_glrt_mean":d.get("post_attack_glrt_mean"),
                  "post_attack_glrt_max":d.get("post_attack_glrt_max"),
              })
          summary={
              "candidate":"fixed_7x7_constant_damping",
              "SAD_DRAG_K":0.20,
              "SAD_DRAG_MOD":0,
              "rows":rows,
          }
          (root/"summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          print(json.dumps(summary,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sad-thesis-candidate-validation
          path: build/sad_thesis_candidate
          retention-days: 5
