name: Sensor Attack Detector Fixed Stress

on:
  push:
    branches:
      - sad-v2-fixed-model
    paths:
      - '.github/workflows/sad_fixed_stress.yml'

concurrency:
  group: sad-fixed-stress
  cancel-in-progress: true

jobs:
  stress:
    runs-on: ubuntu-latest
    container:
      image: px4io/px4-dev-simulation-focal:2021-09-08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Prepare environment
        run: |
          set -eux
          git tag -f v1.13.0-0.0.1-dev HEAD
          git -C platforms/nuttx/NuttX/nuttx fetch --tags --force
          python3 -m pip install --disable-pip-version-check pyulog pymavlink numpy
          make px4_sitl_default
          make px4_sitl_default sitl_gazebo

      - name: Run nominal maneuver stress
        run: |
          set -eux
          OUT=build/sad_fixed_stress
          mkdir -p "$OUT/nominal"

          common_args () {
            echo "--normal-scale-mean -0.33720698952674866 --normal-scale-sd 0.02 --normal-dynamic-mean 0.42821773886680603 --normal-dynamic-sd 0.05 --weight-acceleration 142.17990926253765 --weight-velocity 71.20519081577794 --weight-position 50.66817247677383 --glrt-mean 4.309805243626817 --glrt-sd 6.958476444883066 --threshold 43.18242814116727 --cusum-drift 0.5 --consecutive 3"
          }

          run_nominal () {
            LABEL="$1"; PROFILE="$2"; SPEED="$3"
            python3 Tools/sensor_attack_detector/run_v2_smoke.py               --scenario maneuver --maneuver "$PROFILE" --speed "$SPEED"               $(common_args)
            RESULT=$(find build/sad_v2_smoke -maxdepth 2 -path '*/maneuver_*/result.json' -type f | sort | tail -n 1)
            cp "$RESULT" "$OUT/nominal/${LABEL}.json"
          }

          run_nominal accel_1 accel 2.2
          run_nominal accel_2 accel 2.2
          run_nominal slalom_1 slalom 1.8
          run_nominal slalom_2 slalom 1.8
          run_nominal hard_turn_1 hard-turn 2.2
          run_nominal hard_turn_2 hard-turn 2.2

      - name: Run slow-attack boundary stress
        run: |
          set -eux
          OUT=build/sad_fixed_stress
          mkdir -p "$OUT/attacks"

          COMMON="--normal-scale-mean -0.33720698952674866 --normal-scale-sd 0.02 --normal-dynamic-mean 0.42821773886680603 --normal-dynamic-sd 0.05 --weight-acceleration 142.17990926253765 --weight-velocity 71.20519081577794 --weight-position 50.66817247677383 --glrt-mean 4.309805243626817 --glrt-sd 6.958476444883066 --threshold 43.18242814116727 --cusum-drift 0.5 --consecutive 3"

          run_attack () {
            LABEL="$1"; RAMP="$2"; OBS="$3"
            python3 Tools/sensor_attack_detector/run_v2_smoke.py               --scenario pva-hover --pva-north 100 --pva-east 0               --pva-ramp "$RAMP" --pva-observation "$OBS" $COMMON
            RESULT=$(find build/sad_v2_smoke -maxdepth 2 -path '*/pva-hover_*/result.json' -type f | sort | tail -n 1)
            cp "$RESULT" "$OUT/attacks/${LABEL}.json"
          }

          run_attack north_100_50 50 25
          run_attack north_100_60 60 30
          run_attack north_100_80 80 40

          python3 Tools/sensor_attack_detector/run_v2_smoke.py \
            --scenario pva-hover --pva-north 100 --pva-east 0 \
            --pva-ramp 20 --pva-observation 14 --pva-profile sinusoidal $COMMON
          RESULT=$(find build/sad_v2_smoke -maxdepth 2 -path '*/pva-hover_*/result.json' -type f | sort | tail -n 1)
          cp "$RESULT" "$OUT/attacks/north_100_20_sinusoidal.json"

      - name: Summarize stress results
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("build/sad_fixed_stress")
          nominal=[]
          for p in sorted((root/"nominal").glob("*.json")):
              r=json.load(open(p)); d=r["detector"]
              nominal.append({
                  "case":p.stem,
                  "alert_samples":d.get("alert_samples"),
                  "glrt_mean":d.get("glrt_mean"),
                  "glrt_max":d.get("glrt_max"),
              })
          attacks=[]
          for p in sorted((root/"attacks").glob("*.json")):
              r=json.load(open(p)); d=r["detector"]
              attacks.append({
                  "case":p.stem,
                  "pre_attack_alert_count":d.get("pre_attack_alert_count"),
                  "post_attack_alert_count":d.get("post_attack_alert_count"),
                  "first_alert_delay_s":d.get("first_alert_delay_s"),
                  "post_attack_glrt_mean":d.get("post_attack_glrt_mean"),
                  "post_attack_glrt_max":d.get("post_attack_glrt_max"),
              })
          summary={"nominal":nominal,"attacks":attacks}
          (root/"summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          print(json.dumps(summary,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sad-fixed-stress
          path: build/sad_fixed_stress
          retention-days: 5
