name: Sensor Attack Detector Nominal Challenge Matrix

on:
  push:
    branches:
      - sad-v2-fixed-model
    paths:
      - '.github/workflows/sad_v2_nominal_challenge.yml'

concurrency:
  group: sad-v2-nominal-challenge
  cancel-in-progress: true

jobs:
  nominal-challenge:
    runs-on: ubuntu-latest
    container:
      image: px4io/px4-dev-simulation-focal:2021-09-08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Prepare environment
        run: |
          set -eux
          git tag -f v1.13.0-0.0.1-dev HEAD
          git -C platforms/nuttx/NuttX/nuttx fetch --tags --force
          python3 -m pip install --disable-pip-version-check pyulog pymavlink numpy
          make px4_sitl_default
          make px4_sitl_default sitl_gazebo

      - name: Run nominal challenge matrix
        run: |
          set -eux
          OUT=build/sad_v2_nominal_challenge
          rm -rf build/sad_v2_smoke "$OUT"
          mkdir -p "$OUT"

          COMMON="--normal-scale-mean -0.33720698952674866             --normal-scale-sd 0.02             --normal-dynamic-mean 0.42821773886680603             --normal-dynamic-sd 0.05             --weight-acceleration 142.17990926253765             --weight-velocity 71.20519081577794             --weight-position 50.66817247677383             --glrt-mean 4.309805243626817             --glrt-sd 6.958476444883066             --threshold 43.18242814116727"

          run_case () {
            LABEL="$1"; shift
            python3 Tools/sensor_attack_detector/run_v2_smoke.py "$@" $COMMON
            RESULT=$(find build/sad_v2_smoke -maxdepth 2 -name result.json -type f | sort | tail -n 1)
            cp "$RESULT" "$OUT/${LABEL}.json"
          }

          run_case accel_18 --scenario maneuver --maneuver accel --speed 1.8
          run_case accel_22 --scenario maneuver --maneuver accel --speed 2.2
          run_case accel_30 --scenario maneuver --maneuver accel --speed 3.0

          run_case slalom_15 --scenario maneuver --maneuver slalom --speed 1.5
          run_case slalom_18 --scenario maneuver --maneuver slalom --speed 1.8
          run_case slalom_24 --scenario maneuver --maneuver slalom --speed 2.4

          run_case hard_turn_20 --scenario maneuver --maneuver hard-turn --speed 2.0
          run_case hard_turn_24 --scenario maneuver --maneuver hard-turn --speed 2.4
          run_case hard_turn_28 --scenario maneuver --maneuver hard-turn --speed 2.8

          run_case turn_20_3s --scenario turn --speed 2.0 --turn-duration 3             --straight-before 10 --straight-after 14
          run_case turn_20_2s --scenario turn --speed 2.0 --turn-duration 2             --straight-before 10 --straight-after 14

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("build/sad_v2_nominal_challenge")
          rows=[]
          for p in sorted(root.glob("*.json")):
              if p.name=="summary.json":
                  continue
              r=json.load(open(p)); d=r["detector"]
              rows.append({
                  "case":p.stem,
                  "alerts":d.get("alert_samples"),
                  "glrt_mean":d.get("glrt_mean"),
                  "glrt_p95":d.get("glrt_p95"),
                  "glrt_max":d.get("glrt_max"),
                  "cusum_max":d.get("cusum_max"),
                  "threshold":d.get("threshold_value"),
                  "cusum_margin":d.get("cusum_margin"),
              })
          (root/"summary.json").write_text(json.dumps(rows,indent=2,sort_keys=True)+"\n")
          print(json.dumps(rows,indent=2,sort_keys=True))
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sad-v2-nominal-challenge
          path: build/sad_v2_nominal_challenge
          retention-days: 5
