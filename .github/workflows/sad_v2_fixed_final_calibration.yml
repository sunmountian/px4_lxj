name: Sensor Attack Detector Fixed Final Calibration

on:
  push:
    branches:
      - sad-v2-fixed-model
    paths:
      - '.github/workflows/sad_v2_fixed_final_calibration.yml'

concurrency:
  group: sad-v2-fixed-final-calibration
  cancel-in-progress: true

jobs:
  final-calibration:
    runs-on: ubuntu-latest
    container:
      image: px4io/px4-dev-simulation-focal:2021-09-08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Prepare environment
        run: |
          set -eux
          git tag -f v1.13.0-0.0.1-dev HEAD
          git -C platforms/nuttx/NuttX/nuttx fetch --tags --force
          python3 -m pip install --disable-pip-version-check pyulog pymavlink numpy
          make px4_sitl_default
          make px4_sitl_default sitl_gazebo

      - name: Collect weight-calibration nominal flights
        run: |
          set -eux
          rm -rf build/sad_v2_smoke build/sad_v2_fixed_final
          mkdir -p build/sad_v2_fixed_final/weights

          AS_MU=-0.33720698952674866
          AD_MU=0.42821773886680603

          run_turn () {
            SPEED="$1"; DUR="$2"
            python3 Tools/sensor_attack_detector/run_v2_smoke.py               --scenario turn --speed "$SPEED" --turn-duration "$DUR"               --straight-before 10 --straight-after 14               --normal-scale-mean "$AS_MU" --normal-scale-sd 0.02               --normal-dynamic-mean "$AD_MU" --normal-dynamic-sd 0.05               --weight-acceleration 1 --weight-velocity 1 --weight-position 1               --glrt-mean 0 --glrt-sd 1 --threshold 1000000
          }

          run_turn 0.7 4
          run_turn 1.0 6
          run_turn 1.3 8
          run_turn 1.3 4

          printf 'flight_id,scenario,nominal,ulog\n' > build/sad_v2_fixed_final/weights/manifest.csv
          i=0
          for RESULT in $(find build/sad_v2_smoke -maxdepth 2 -path '*/turn_*/result.json' -type f | sort); do
            i=$((i + 1))
            ULOG=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ulog"])' "$RESULT")
            printf 'weight_%02d,turn,1,%s\n' "$i" "$ULOG" >> build/sad_v2_fixed_final/weights/manifest.csv
          done
          test "$i" -eq 4

          python3 Tools/sensor_attack_detector/calibrate_residual_weights.py             --manifest build/sad_v2_fixed_final/weights/manifest.csv             --output build/sad_v2_fixed_final/weights/weights.json             --minimum-flights 4
          cat build/sad_v2_fixed_final/weights/weights.json

      - name: Collect fit calibration and held-out nominal flights
        run: |
          set -eux
          rm -rf build/sad_v2_smoke
          mkdir -p build/sad_v2_fixed_final/threshold

          AS_MU=-0.33720698952674866
          AD_MU=0.42821773886680603
          WA=$(python3 -c 'import json; print(json.load(open("build/sad_v2_fixed_final/weights/weights.json"))["candidate_parameters"]["SAD_WA"])')
          WV=$(python3 -c 'import json; print(json.load(open("build/sad_v2_fixed_final/weights/weights.json"))["candidate_parameters"]["SAD_WV"])')
          WP=$(python3 -c 'import json; print(json.load(open("build/sad_v2_fixed_final/weights/weights.json"))["candidate_parameters"]["SAD_WP"])')

          cat > /tmp/cases.txt <<'EOF'
          0.7 4
          1.0 4
          1.3 4
          0.7 6
          1.0 6
          1.3 6
          0.7 8
          1.0 8
          1.3 8
          1.3 4
          1.0 6
          0.7 8
          1.3 8
          0.7 4
          1.0 4
          1.3 6
          0.7 6
          1.0 8
          1.3 4
          0.7 8
          1.0 6
          1.3 8
          0.7 4
          1.0 8
          1.3 6
          0.7 6
          1.0 4
          1.3 8
          0.7 8
          1.0 6
          EOF

          i=0
          while read SPEED DUR; do
            i=$((i + 1))
            python3 Tools/sensor_attack_detector/run_v2_smoke.py               --scenario turn --speed "$SPEED" --turn-duration "$DUR"               --straight-before 10 --straight-after 14               --normal-scale-mean "$AS_MU" --normal-scale-sd 0.02               --normal-dynamic-mean "$AD_MU" --normal-dynamic-sd 0.05               --weight-acceleration "$WA" --weight-velocity "$WV" --weight-position "$WP"               --glrt-mean 0 --glrt-sd 1 --threshold 1000000
          done < /tmp/cases.txt
          test "$i" -eq 30

          printf 'flight_id,split,scenario,nominal,ulog\n' > build/sad_v2_fixed_final/threshold/manifest.csv
          i=0
          for RESULT in $(find build/sad_v2_smoke -maxdepth 2 -path '*/turn_*/result.json' -type f | sort); do
            i=$((i + 1))
            ULOG=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ulog"])' "$RESULT")
            if [ "$i" -le 5 ]; then
              SPLIT=fit
            elif [ "$i" -le 24 ]; then
              SPLIT=calibration
            else
              SPLIT=test
            fi
            printf 'nominal_%02d,%s,turn,1,%s\n' "$i" "$SPLIT" "$ULOG" >> build/sad_v2_fixed_final/threshold/manifest.csv
          done
          test "$i" -eq 30

          python3 Tools/sensor_attack_detector/calibrate_thresholds.py             --manifest build/sad_v2_fixed_final/threshold/manifest.csv             --output build/sad_v2_fixed_final/threshold/thresholds.json             --false-alarm-rate 0.05             --drift 0.5             --consecutive 3
          cat build/sad_v2_fixed_final/threshold/thresholds.json

      - name: Run final attack matrix
        run: |
          set -eux
          rm -rf build/sad_v2_smoke
          mkdir -p build/sad_v2_fixed_final/attacks

          AS_MU=-0.33720698952674866
          AD_MU=0.42821773886680603
          WA=$(python3 -c 'import json; print(json.load(open("build/sad_v2_fixed_final/weights/weights.json"))["candidate_parameters"]["SAD_WA"])')
          WV=$(python3 -c 'import json; print(json.load(open("build/sad_v2_fixed_final/weights/weights.json"))["candidate_parameters"]["SAD_WV"])')
          WP=$(python3 -c 'import json; print(json.load(open("build/sad_v2_fixed_final/weights/weights.json"))["candidate_parameters"]["SAD_WP"])')
          GMU=$(python3 -c 'import json; print(json.load(open("build/sad_v2_fixed_final/threshold/thresholds.json"))["candidate_parameters"]["SAD_GLRT_MU"])')
          GSD=$(python3 -c 'import json; print(json.load(open("build/sad_v2_fixed_final/threshold/thresholds.json"))["candidate_parameters"]["SAD_GLRT_SD"])')
          THR=$(python3 -c 'import json; print(json.load(open("build/sad_v2_fixed_final/threshold/thresholds.json"))["candidate_parameters"]["SAD_THRESH"])')

          run_attack () {
            LABEL="$1"; N="$2"; E="$3"; RAMP="$4"
            python3 Tools/sensor_attack_detector/run_v2_smoke.py               --scenario pva-hover --pva-north "$N" --pva-east "$E"               --pva-ramp "$RAMP" --pva-observation 14               --normal-scale-mean "$AS_MU" --normal-scale-sd 0.02               --normal-dynamic-mean "$AD_MU" --normal-dynamic-sd 0.05               --weight-acceleration "$WA" --weight-velocity "$WV" --weight-position "$WP"               --glrt-mean "$GMU" --glrt-sd "$GSD" --threshold "$THR"
            RESULT=$(find build/sad_v2_smoke -maxdepth 2 -path '*/pva-hover_*/result.json' -type f | sort | tail -n 1)
            cp "$RESULT" "build/sad_v2_fixed_final/attacks/${LABEL}.json"
          }

          run_attack north_pos_100_20 100 0 20
          run_attack north_neg_100_20 -100 0 20
          run_attack east_pos_100_20 0 100 20
          run_attack east_neg_100_20 0 -100 20
          run_attack north_pos_100_30 100 0 30
          run_attack north_pos_100_40 100 0 40

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("build/sad_v2_fixed_final")
          threshold=json.load(open(root/"threshold/thresholds.json"))
          weights=json.load(open(root/"weights/weights.json"))
          attacks=[]
          for p in sorted((root/"attacks").glob("*.json")):
              r=json.load(open(p))
              d=r["detector"]
              attacks.append({
                  "case":p.stem,
                  "pre_attack_alert_count":d.get("pre_attack_alert_count"),
                  "post_attack_alert_count":d.get("post_attack_alert_count"),
                  "first_alert_delay_s":d.get("first_alert_delay_s"),
                  "post_attack_glrt_mean":d.get("post_attack_glrt_mean"),
                  "post_attack_glrt_max":d.get("post_attack_glrt_max"),
              })
          tests=[f for f in threshold["flights"] if f["split"]=="test"]
          summary={
              "model":"fixed_7x7",
              "weights":weights["candidate_parameters"],
              "residual_sigma":weights["residual_sigma"],
              "threshold":threshold["candidate_parameters"],
              "flight_level_threshold":threshold["flight_level_threshold"],
              "held_out_test_flights":tests,
              "held_out_test_alert_count":sum(bool(f["candidate_alert"]) for f in tests),
              "attack_results":attacks,
          }
          (root/"summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Upload final calibration outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sad-v2-fixed-final-calibration
          path: build/sad_v2_fixed_final
          retention-days: 5
