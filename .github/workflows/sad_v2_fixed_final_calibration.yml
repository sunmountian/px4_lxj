name: Sensor Attack Detector Thesis Final Calibration

on:
  push:
    branches:
      - sad-v2-fixed-model
    paths:
      - '.github/workflows/sad_v2_fixed_final_calibration.yml'

concurrency:
  group: sad-thesis-final-calibration
  cancel-in-progress: true

jobs:
  final-calibration:
    runs-on: ubuntu-latest
    container:
      image: px4io/px4-dev-simulation-focal:2021-09-08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Prepare environment
        run: |
          set -eux
          git tag -f v1.13.0-0.0.1-dev HEAD
          git -C platforms/nuttx/NuttX/nuttx fetch --tags --force
          python3 -m pip install --disable-pip-version-check pyulog pymavlink numpy
          make px4_sitl_default
          make px4_sitl_default sitl_gazebo

      - name: Collect mixed nominal flights for residual weights
        run: |
          set -eux
          rm -rf build/sad_v2_smoke build/sad_v2_fixed_final
          mkdir -p build/sad_v2_fixed_final/weights

          COMMON="--thr-map 0 --thr-gain 3.47118998 --drag-k 0.20 --drag-mod 0 --normal-scale-mean -0.33720698952674866 --normal-scale-sd 0.02 --normal-dynamic-mean 0.42821773886680603 --dynamic-lag 0.2 --normal-dynamic-sd 0.05 --weight-acceleration 1 --weight-velocity 1 --weight-position 1 --glrt-mean 0 --glrt-sd 1 --threshold 1000000 --attack-mask 7"

          printf 'flight_id,scenario,nominal,ulog\n' > build/sad_v2_fixed_final/weights/manifest.csv

          run_weight () {
            ID="$1"; SC="$2"; shift 2
            MARKER=$(mktemp); touch "$MARKER"
            python3 Tools/sensor_attack_detector/run_v2_smoke.py "$@" $COMMON
            RESULT=$(find build/sad_v2_smoke -maxdepth 2 -name result.json -type f -newer "$MARKER" | head -n 1)
            rm -f "$MARKER"; test -n "$RESULT"
            ULOG=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ulog"])' "$RESULT")
            printf '%s,%s,1,%s\n' "$ID" "$SC" "$ULOG" >> build/sad_v2_fixed_final/weights/manifest.csv
          }

          run_weight w_hover hover --scenario hover
          run_weight w_turn_08_6 turn --scenario turn --speed 0.8 --turn-duration 6 --straight-before 10 --straight-after 14
          run_weight w_turn_10_4 turn --scenario turn --speed 1.0 --turn-duration 4 --straight-before 10 --straight-after 14
          run_weight w_turn_13_8 turn --scenario turn --speed 1.3 --turn-duration 8 --straight-before 10 --straight-after 14
          run_weight w_accel_18 accel --scenario maneuver --maneuver accel --speed 1.8
          run_weight w_accel_22 accel --scenario maneuver --maneuver accel --speed 2.2

          python3 Tools/sensor_attack_detector/calibrate_residual_weights.py             --manifest build/sad_v2_fixed_final/weights/manifest.csv             --output build/sad_v2_fixed_final/weights/weights.json             --minimum-flights 6
          cat build/sad_v2_fixed_final/weights/weights.json

      - name: Collect mixed nominal threshold calibration flights
        run: |
          set -eux
          rm -rf build/sad_v2_smoke
          mkdir -p build/sad_v2_fixed_final/threshold

          WA=$(python3 -c 'import json; print(json.load(open("build/sad_v2_fixed_final/weights/weights.json"))["candidate_parameters"]["SAD_WA"])')
          WV=$(python3 -c 'import json; print(json.load(open("build/sad_v2_fixed_final/weights/weights.json"))["candidate_parameters"]["SAD_WV"])')
          WP=$(python3 -c 'import json; print(json.load(open("build/sad_v2_fixed_final/weights/weights.json"))["candidate_parameters"]["SAD_WP"])')

          COMMON="--thr-map 0 --thr-gain 3.47118998 --drag-k 0.20 --drag-mod 0 --normal-scale-mean -0.33720698952674866 --normal-scale-sd 0.02 --normal-dynamic-mean 0.42821773886680603 --dynamic-lag 0.2 --normal-dynamic-sd 0.05 --weight-acceleration $WA --weight-velocity $WV --weight-position $WP --glrt-mean 0 --glrt-sd 1 --threshold 1000000 --attack-mask 7"

          printf 'flight_id,split,scenario,nominal,ulog\n' > build/sad_v2_fixed_final/threshold/manifest.csv

          run_nominal () {
            ID="$1"; SPLIT="$2"; SC="$3"; shift 3
            MARKER=$(mktemp); touch "$MARKER"
            python3 Tools/sensor_attack_detector/run_v2_smoke.py "$@" $COMMON
            RESULT=$(find build/sad_v2_smoke -maxdepth 2 -name result.json -type f -newer "$MARKER" | head -n 1)
            rm -f "$MARKER"; test -n "$RESULT"
            ULOG=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ulog"])' "$RESULT")
            printf '%s,%s,%s,1,%s\n' "$ID" "$SPLIT" "$SC" "$ULOG" >> build/sad_v2_fixed_final/threshold/manifest.csv
          }

          # Five flights fit the fixed GLRT normalization.
          run_nominal fit01 fit hover --scenario hover
          run_nominal fit02 fit turn --scenario turn --speed 0.8 --turn-duration 6 --straight-before 10 --straight-after 14
          run_nominal fit03 fit turn --scenario turn --speed 1.3 --turn-duration 8 --straight-before 10 --straight-after 14
          run_nominal fit04 fit accel --scenario maneuver --maneuver accel --speed 1.8
          run_nominal fit05 fit accel --scenario maneuver --maneuver accel --speed 2.2

          # Nineteen independent nominal runs support a 5% flight-level empirical threshold.
          run_nominal cal01 calibration hover --scenario hover
          run_nominal cal02 calibration turn --scenario turn --speed 0.7 --turn-duration 4 --straight-before 10 --straight-after 14
          run_nominal cal03 calibration turn --scenario turn --speed 0.7 --turn-duration 6 --straight-before 10 --straight-after 14
          run_nominal cal04 calibration turn --scenario turn --speed 0.7 --turn-duration 8 --straight-before 10 --straight-after 14
          run_nominal cal05 calibration turn --scenario turn --speed 1.0 --turn-duration 4 --straight-before 10 --straight-after 14
          run_nominal cal06 calibration turn --scenario turn --speed 1.0 --turn-duration 6 --straight-before 10 --straight-after 14
          run_nominal cal07 calibration turn --scenario turn --speed 1.0 --turn-duration 8 --straight-before 10 --straight-after 14
          run_nominal cal08 calibration turn --scenario turn --speed 1.3 --turn-duration 4 --straight-before 10 --straight-after 14
          run_nominal cal09 calibration turn --scenario turn --speed 1.3 --turn-duration 6 --straight-before 10 --straight-after 14
          run_nominal cal10 calibration turn --scenario turn --speed 1.3 --turn-duration 8 --straight-before 10 --straight-after 14
          run_nominal cal11 calibration accel --scenario maneuver --maneuver accel --speed 1.8
          run_nominal cal12 calibration accel --scenario maneuver --maneuver accel --speed 2.0
          run_nominal cal13 calibration accel --scenario maneuver --maneuver accel --speed 2.2
          run_nominal cal14 calibration hover --scenario hover
          run_nominal cal15 calibration turn --scenario turn --speed 0.9 --turn-duration 5 --straight-before 10 --straight-after 14
          run_nominal cal16 calibration turn --scenario turn --speed 1.1 --turn-duration 7 --straight-before 10 --straight-after 14
          run_nominal cal17 calibration accel --scenario maneuver --maneuver accel --speed 1.9
          run_nominal cal18 calibration accel --scenario maneuver --maneuver accel --speed 2.1
          run_nominal cal19 calibration turn --scenario turn --speed 1.2 --turn-duration 5 --straight-before 10 --straight-after 14

          # Six held-out normal runs are never used to choose the threshold.
          run_nominal test01 test hover --scenario hover
          run_nominal test02 test turn --scenario turn --speed 0.85 --turn-duration 7 --straight-before 10 --straight-after 14
          run_nominal test03 test turn --scenario turn --speed 1.15 --turn-duration 5 --straight-before 10 --straight-after 14
          run_nominal test04 test turn --scenario turn --speed 1.25 --turn-duration 7 --straight-before 10 --straight-after 14
          run_nominal test05 test accel --scenario maneuver --maneuver accel --speed 1.9
          run_nominal test06 test accel --scenario maneuver --maneuver accel --speed 2.1

          python3 Tools/sensor_attack_detector/calibrate_thresholds.py             --manifest build/sad_v2_fixed_final/threshold/manifest.csv             --output build/sad_v2_fixed_final/threshold/thresholds.json             --false-alarm-rate 0.05 --drift 0.5 --consecutive 3
          cat build/sad_v2_fixed_final/threshold/thresholds.json

      - name: Run thesis attack matrix
        run: |
          set -eux
          rm -rf build/sad_v2_smoke
          mkdir -p build/sad_v2_fixed_final/attacks

          WA=$(python3 -c 'import json; print(json.load(open("build/sad_v2_fixed_final/weights/weights.json"))["candidate_parameters"]["SAD_WA"])')
          WV=$(python3 -c 'import json; print(json.load(open("build/sad_v2_fixed_final/weights/weights.json"))["candidate_parameters"]["SAD_WV"])')
          WP=$(python3 -c 'import json; print(json.load(open("build/sad_v2_fixed_final/weights/weights.json"))["candidate_parameters"]["SAD_WP"])')
          GMU=$(python3 -c 'import json; print(json.load(open("build/sad_v2_fixed_final/threshold/thresholds.json"))["candidate_parameters"]["SAD_GLRT_MU"])')
          GSD=$(python3 -c 'import json; print(json.load(open("build/sad_v2_fixed_final/threshold/thresholds.json"))["candidate_parameters"]["SAD_GLRT_SD"])')
          THR=$(python3 -c 'import json; print(json.load(open("build/sad_v2_fixed_final/threshold/thresholds.json"))["candidate_parameters"]["SAD_THRESH"])')

          COMMON="--thr-map 0 --thr-gain 3.47118998 --drag-k 0.20 --drag-mod 0 --normal-scale-mean -0.33720698952674866 --normal-scale-sd 0.02 --normal-dynamic-mean 0.42821773886680603 --dynamic-lag 0.2 --normal-dynamic-sd 0.05 --weight-acceleration $WA --weight-velocity $WV --weight-position $WP --glrt-mean $GMU --glrt-sd $GSD --threshold $THR --cusum-drift 0.5 --consecutive 3 --attack-mask 7"

          run_attack () {
            LABEL="$1"; shift
            MARKER=$(mktemp); touch "$MARKER"
            python3 Tools/sensor_attack_detector/run_v2_smoke.py "$@" $COMMON
            RESULT=$(find build/sad_v2_smoke -maxdepth 2 -name result.json -type f -newer "$MARKER" | head -n 1)
            rm -f "$MARKER"; test -n "$RESULT"
            cp "$RESULT" "build/sad_v2_fixed_final/attacks/${LABEL}.json"
          }

          run_attack north_pos_100_20 --scenario pva-hover --pva-north 100 --pva-east 0 --pva-ramp 20 --pva-observation 14
          run_attack north_neg_100_20 --scenario pva-hover --pva-north -100 --pva-east 0 --pva-ramp 20 --pva-observation 14
          run_attack east_pos_100_20 --scenario pva-hover --pva-north 0 --pva-east 100 --pva-ramp 20 --pva-observation 14
          run_attack east_neg_100_20 --scenario pva-hover --pva-north 0 --pva-east -100 --pva-ramp 20 --pva-observation 14
          run_attack north_pos_100_30 --scenario pva-hover --pva-north 100 --pva-east 0 --pva-ramp 30 --pva-observation 16
          run_attack north_pos_100_40 --scenario pva-hover --pva-north 100 --pva-east 0 --pva-ramp 40 --pva-observation 20
          run_attack sinusoidal_100_20 --scenario pva-hover --pva-north 100 --pva-east 0 --pva-ramp 20 --pva-profile sinusoidal --pva-observation 14

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("build/sad_v2_fixed_final")
          threshold=json.load(open(root/"threshold/thresholds.json"))
          weights=json.load(open(root/"weights/weights.json"))
          attacks=[]
          for p in sorted((root/"attacks").glob("*.json")):
              r=json.load(open(p)); d=r["detector"]
              attacks.append({
                  "case":p.stem,
                  "pre_attack_alert_count":d.get("pre_attack_alert_count"),
                  "post_attack_alert_count":d.get("post_attack_alert_count"),
                  "first_alert_delay_s":d.get("first_alert_delay_s"),
                  "post_attack_glrt_mean":d.get("post_attack_glrt_mean"),
                  "post_attack_glrt_max":d.get("post_attack_glrt_max"),
                  "cusum_max":d.get("cusum_max"),
              })
          tests=[f for f in threshold["flights"] if f["split"]=="test"]
          summary={
              "model":"thesis_fixed_7x7_constant_damping",
              "physical_reference":{"SAD_THR_MAP":0,"SAD_THR_GAIN":3.47118998,"SAD_DRAG_K":0.20,"SAD_DRAG_MOD":0,"SAD_DYN_LAG":0.2},
              "weights":weights["candidate_parameters"],
              "residual_sigma":weights["residual_sigma"],
              "threshold":threshold["candidate_parameters"],
              "flight_level_threshold":threshold["flight_level_threshold"],
              "held_out_test_flights":tests,
              "held_out_test_alert_count":sum(bool(f["candidate_alert"]) for f in tests),
              "attack_results":attacks,
          }
          (root/"summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Upload thesis final calibration outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sad-thesis-final-calibration
          path: build/sad_v2_fixed_final
          retention-days: 5
