name: Sensor Attack Detector V2 Threshold Only

on:
  push:
    branches:
      - sad-v2-experiment
    paths:
      - '.github/workflows/sad_v2_threshold_only.yml'

jobs:
  threshold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install pyulog
        run: python3 -m pip install --disable-pip-version-check pyulog numpy
      - name: Reuse five-flight nominal artifact
        uses: actions/download-artifact@v4
        with:
          name: sad-v2-sweep
          path: build
          github-token: ${{ github.token }}
          run-id: 37457914689
      - name: Rewrite artifact manifest paths
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          p=Path("build/sad_v2_smoke/sweep/threshold_manifest.csv")
          rows=list(csv.DictReader(p.open()))
          roots=list(Path("build/px4_sitl_default/tmp/rootfs/log").rglob("*.ulg"))
          by_name={x.name:x for x in roots}
          for row in rows:
              name=Path(row["ulog"]).name
              if name not in by_name:
                  raise SystemExit(f"missing artifact ULog {name}")
              row["ulog"]=str(by_name[name].resolve())
          with p.open("w",newline="") as f:
              w=csv.DictWriter(f,fieldnames=["flight_id","split","scenario","nominal","ulog"])
              w.writeheader(); w.writerows(rows)
          print(p.read_text())
          PY
      - name: Calibrate development threshold
        run: |
          set -eux
          python3 Tools/sensor_attack_detector/calibrate_thresholds.py \
            --manifest build/sad_v2_smoke/sweep/threshold_manifest.csv \
            --false-alarm-rate 0.05 --drift 0.5 --consecutive 3 \
            --output build/sad_v2_smoke/sweep/thresholds.json
          cat build/sad_v2_smoke/sweep/thresholds.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: sad-v2-threshold-only
          path: build/sad_v2_smoke/sweep/thresholds*
          retention-days: 3
