name: Sensor Attack Detector Physics Map AB

on:
  push:
    branches:
      - sad-v2-physics-map
    paths:
      - '.github/workflows/sad_physics_map_ab.yml'
      - 'src/modules/sensor_attack_detector/**'
      - 'Tools/sensor_attack_detector/run_v2_smoke.py'

concurrency:
  group: sad-physics-map-ab
  cancel-in-progress: true

jobs:
  map-ab:
    runs-on: ubuntu-latest
    container:
      image: px4io/px4-dev-simulation-focal:2021-09-08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Prepare environment
        run: |
          set -eux
          git tag -f v1.13.0-0.0.1-dev HEAD
          git -C platforms/nuttx/NuttX/nuttx fetch --tags --force
          python3 -m pip install --disable-pip-version-check pyulog pymavlink numpy
          make px4_sitl_default
          make px4_sitl_default sitl_gazebo

      - name: Run linear versus quadratic physical-reference A/B
        run: |
          set -eux
          OUT=build/sad_physics_map_ab
          mkdir -p "$OUT"
          COMMON="--weight-acceleration 142.17990926253765 --weight-velocity 71.20519081577794 --weight-position 50.66817247677383 --regularization 0.1 --glrt-mean 0 --glrt-sd 1 --threshold 1000000 --cusum-drift 0.5 --consecutive 3"

          run_case () {
            LABEL="$1"; shift
            BEFORE=$(mktemp); AFTER=$(mktemp)
            find build/sad_v2_smoke -maxdepth 2 -name result.json -type f 2>/dev/null | sort > "$BEFORE" || true
            python3 Tools/sensor_attack_detector/run_v2_smoke.py "$@" $COMMON
            find build/sad_v2_smoke -maxdepth 2 -name result.json -type f | sort > "$AFTER"
            RESULT=$(comm -13 "$BEFORE" "$AFTER" | tail -n 1)
            test -n "$RESULT"
            cp "$RESULT" "$OUT/${LABEL}.json"
            rm -f "$BEFORE" "$AFTER"
          }

          LINEAR="--map-mode 0 --map-idle 0 --thr-gain 3.47118998 --normal-scale-mean -0.33720698952674866 --normal-scale-sd 0.02 --normal-dynamic-mean 0.42821773886680603 --normal-dynamic-sd 0.05"
          QUAD="--map-mode 1 --map-idle 0.1 --thr-gain 3.804560260586319 --normal-scale-mean 0 --normal-scale-sd 0.02 --normal-dynamic-mean 0 --normal-dynamic-sd 0.05"

          run_case linear_turn --scenario turn --speed 1.3 --turn-duration 8 --straight-before 10 --straight-after 14 $LINEAR
          run_case quad_turn --scenario turn --speed 1.3 --turn-duration 8 --straight-before 10 --straight-after 14 $QUAD

          run_case linear_slalom --scenario maneuver --maneuver slalom --speed 1.8 $LINEAR
          run_case quad_slalom --scenario maneuver --maneuver slalom --speed 1.8 $QUAD

          run_case linear_hard --scenario maneuver --maneuver hard-turn --speed 2.2 $LINEAR
          run_case quad_hard --scenario maneuver --maneuver hard-turn --speed 2.2 $QUAD

          run_case linear_attack --scenario pva-hover --pva-north 100 --pva-east 0 --pva-ramp 20 --pva-observation 10 $LINEAR
          run_case quad_attack --scenario pva-hover --pva-north 100 --pva-east 0 --pva-ramp 20 --pva-observation 10 $QUAD

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("build/sad_physics_map_ab")
          rows={}
          for p in sorted(root.glob("*.json")):
              if p.name=="summary.json": continue
              r=json.load(open(p)); d=r["detector"]
              rows[p.stem]={
                  "scenario":r["scenario"],
                  "map_mode":r["parameters"].get("SAD_MAP_MODE"),
                  "map_idle":r["parameters"].get("SAD_MAP_IDLE"),
                  "thr_gain":r["parameters"].get("SAD_THR_GAIN"),
                  "alpha":r["parameters"].get("SAD_AS_MU"),
                  "beta":r["parameters"].get("SAD_AD_MU"),
                  "glrt_mean":d.get("glrt_mean"),
                  "glrt_p95":d.get("glrt_p95"),
                  "glrt_max":d.get("glrt_max"),
                  "post_attack_glrt_mean":d.get("post_attack_glrt_mean"),
                  "post_attack_glrt_max":d.get("post_attack_glrt_max"),
              }
          ratios={}
          for case in ("turn","slalom","hard","attack"):
              a=rows[f"linear_{case}"]; b=rows[f"quad_{case}"]
              key="post_attack_glrt_mean" if case=="attack" else "glrt_mean"
              ratios[case]={
                  "quadratic_over_linear_mean":b[key]/max(a[key],1e-12),
                  "linear_mean":a[key],
                  "quadratic_mean":b[key],
              }
          summary={"cases":rows,"ratios":ratios}
          (root/"summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          print(json.dumps(summary,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sad-physics-map-ab
          path: build/sad_physics_map_ab
          retention-days: 5
