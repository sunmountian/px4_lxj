name: Sensor Attack Detector Drag Gain Scan

on:
  push:
    branches:
      - sad-v2-physics-map
    paths:
      - '.github/workflows/sad_drag_gain_scan.yml'

jobs:
  drag-scan:
    strategy:
      fail-fast: false
      matrix:
        drag_gain: [0.0, 0.15, 0.22, 0.30]
    runs-on: ubuntu-latest
    container:
      image: px4io/px4-dev-simulation-focal:2021-09-08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Prepare environment
        run: |
          set -eux
          git tag -f v1.13.0-0.0.1-dev HEAD
          git -C platforms/nuttx/NuttX/nuttx fetch --tags --force
          python3 -m pip install --disable-pip-version-check pyulog pymavlink numpy
          make px4_sitl_default
          make px4_sitl_default sitl_gazebo

      - name: Run drag mechanism scan
        env:
          DRAG_GAIN: ${{ matrix.drag_gain }}
        run: |
          set -eux
          TAG=$(printf '%s' "$DRAG_GAIN" | tr '.' '_')
          OUT="build/sad_drag_scan/$TAG"
          mkdir -p "$OUT"
          COMMON="--map-mode 0 --map-idle 0 --drag-gain $DRAG_GAIN --thr-gain 3.47118998 --normal-scale-mean -0.33720698952674866 --normal-scale-sd 0.02 --normal-dynamic-mean 0.42821773886680603 --normal-dynamic-sd 0.05 --weight-acceleration 142.17990926253765 --weight-velocity 71.20519081577794 --weight-position 50.66817247677383 --regularization 0.1 --glrt-mean 0 --glrt-sd 1 --threshold 1000000 --cusum-drift 0.5 --consecutive 3"

          run_case () {
            LABEL="$1"; shift
            BEFORE=$(mktemp); AFTER=$(mktemp)
            find build/sad_v2_smoke -maxdepth 2 -name result.json -type f 2>/dev/null | sort > "$BEFORE" || true
            python3 Tools/sensor_attack_detector/run_v2_smoke.py "$@" $COMMON
            find build/sad_v2_smoke -maxdepth 2 -name result.json -type f | sort > "$AFTER"
            RESULT=$(comm -13 "$BEFORE" "$AFTER" | tail -n 1)
            test -n "$RESULT"
            cp "$RESULT" "$OUT/${LABEL}.json"
            rm -f "$BEFORE" "$AFTER"
          }

          run_case turn --scenario turn --speed 1.3 --turn-duration 8 --straight-before 10 --straight-after 14
          run_case slalom --scenario maneuver --maneuver slalom --speed 1.8
          run_case hard_turn --scenario maneuver --maneuver hard-turn --speed 2.2
          run_case attack_100_20 --scenario pva-hover --pva-north 100 --pva-east 0 --pva-ramp 20 --pva-observation 10

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          tag=os.environ["DRAG_GAIN"].replace(".","_")
          root=Path("build/sad_drag_scan")/tag
          out={"drag_gain":float(os.environ["DRAG_GAIN"]),"cases":{}}
          for p in sorted(root.glob("*.json")):
              if p.name=="summary.json": continue
              r=json.load(open(p)); d=r["detector"]
              out["cases"][p.stem]={
                  "glrt_mean":d.get("glrt_mean"),
                  "glrt_p95":d.get("glrt_p95"),
                  "glrt_max":d.get("glrt_max"),
                  "pre_attack_glrt_mean":d.get("pre_attack_glrt_mean"),
                  "post_attack_glrt_mean":d.get("post_attack_glrt_mean"),
                  "post_attack_glrt_max":d.get("post_attack_glrt_max"),
              }
          (root/"summary.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sad-drag-scan-${{ matrix.drag_gain }}
          path: build/sad_drag_scan
          retention-days: 5
