name: Sensor Attack Detector Actuator Mapping Crossfit

on:
  push:
    branches:
      - sad-v2-fixed-model
    paths:
      - '.github/workflows/sad_actuator_mapping_crossfit.yml'

jobs:
  crossfit:
    runs-on: ubuntu-latest
    container:
      image: px4io/px4-dev-simulation-focal:2021-09-08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Prepare environment
        run: |
          set -eux
          git tag -f v1.13.0-0.0.1-dev HEAD
          git -C platforms/nuttx/NuttX/nuttx fetch --tags --force
          python3 -m pip install --disable-pip-version-check pyulog pymavlink numpy
          make px4_sitl_default
          make px4_sitl_default sitl_gazebo

      - name: Generate nominal ULogs
        run: |
          set -eux
          OUT=build/sad_mapping_crossfit
          mkdir -p "$OUT"
          COMMON="--normal-scale-mean -0.33720698952674866 --normal-scale-sd 0.02 --normal-dynamic-mean 0.42821773886680603 --normal-dynamic-sd 0.05 --weight-acceleration 142.17990926253765 --weight-velocity 71.20519081577794 --weight-position 50.66817247677383 --glrt-mean 4.309805243626817 --glrt-sd 6.958476444883066 --threshold 43.18242814116727"

          run_case () {
            LABEL="$1"; shift
            BEFORE=$(mktemp)
            AFTER=$(mktemp)
            find build/sad_v2_smoke -maxdepth 2 -name result.json -type f 2>/dev/null | sort > "$BEFORE" || true
            python3 Tools/sensor_attack_detector/run_v2_smoke.py "$@" $COMMON
            find build/sad_v2_smoke -maxdepth 2 -name result.json -type f | sort > "$AFTER"
            RESULT=$(comm -13 "$BEFORE" "$AFTER" | tail -n 1)
            test -n "$RESULT"
            cp "$RESULT" "$OUT/${LABEL}.json"
            ULOG=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ulog"])' "$RESULT")
            cp "$ULOG" "$OUT/${LABEL}.ulg"
            rm -f "$BEFORE" "$AFTER"
          }

          run_case baseline_turn --scenario turn --speed 1.3 --turn-duration 8 --straight-before 10 --straight-after 14
          run_case accel_reverse --scenario maneuver --maneuver accel --speed 2.2
          run_case slalom --scenario maneuver --maneuver slalom --speed 1.8
          run_case hard_turn --scenario maneuver --maneuver hard-turn --speed 2.2

      - name: Cross-fit physical actuator models
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from pyulog import ULog

          root=Path("build/sad_mapping_crossfit")
          IDLE=0.1
          LAG_US=200000

          def ds(u,name):
              xs=[x for x in u.data_list if x.name==name]
              if len(xs)!=1: raise RuntimeError(f"{name}: {len(xs)} instances")
              return xs[0].data

          def prev(ts,vals,target):
              idx=np.searchsorted(ts,target,side="right")-1
              idx=np.clip(idx,0,len(ts)-1)
              return vals[idx]

          def interp(ts,vals,target):
              return np.interp(target,ts,vals)

          def dcm_from_q(q):
              w,x,y,z=q.T
              R=np.empty((len(q),3,3))
              R[:,0,0]=1-2*(y*y+z*z); R[:,0,1]=2*(x*y-w*z); R[:,0,2]=2*(x*z+w*y)
              R[:,1,0]=2*(x*y+w*z); R[:,1,1]=1-2*(x*x+z*z); R[:,1,2]=2*(y*z-w*x)
              R[:,2,0]=2*(x*z-w*y); R[:,2,1]=2*(y*z+w*x); R[:,2,2]=1-2*(x*x+y*y)
              return R

          def load(path):
              u=ULog(str(path),None,disable_str_exceptions=True)
              imu=ds(u,"vehicle_imu"); att=ds(u,"vehicle_attitude")
              act=ds(u,"actuator_outputs"); land=ds(u,"vehicle_land_detected")
              lp=ds(u,"vehicle_local_position")

              ti=np.asarray(imu["timestamp_sample"],dtype=np.int64)
              dt=np.asarray(imu["delta_velocity_dt"],dtype=float)*1e-6
              dv=np.column_stack([np.asarray(imu[f"delta_velocity[{i}]"],dtype=float) for i in range(3)])

              ta=np.asarray(att["timestamp_sample"],dtype=np.int64)
              q=np.column_stack([interp(ta,np.asarray(att[f"q[{i}]"],dtype=float),ti) for i in range(4)])
              q=q/np.maximum(np.linalg.norm(q,axis=1)[:,None],1e-12)
              R=dcm_from_q(q)
              zaxis=R[:,:,2]
              y=np.einsum("nij,nj->ni",R,dv)/np.maximum(dt[:,None],1e-9)

              to=np.asarray(act["timestamp"],dtype=np.int64)
              outs=np.column_stack([np.asarray(act[f"output[{i}]"],dtype=float) for i in range(4)])
              ua=prev(to,outs,ti)
              un=np.clip((ua-1000.0)/1000.0,0.0,1.0)

              s1=np.sum(un,axis=1)
              s2=np.sum(un*un,axis=1)
              soff=np.sum((un+IDLE)*(un+IDLE),axis=1)
              srot=np.sum(un+IDLE,axis=1)
              phi1=-zaxis[:,:2]*s1[:,None]
              phi2=-zaxis[:,:2]*s2[:,None]
              phioff=-zaxis[:,:2]*soff[:,None]

              tlp=np.asarray(lp["timestamp_sample"],dtype=np.int64)
              vel=np.column_stack([
                  interp(tlp,np.asarray(lp[k],dtype=float),ti)
                  for k in ("vx","vy","vz")
              ])
              dot=np.sum(vel*zaxis,axis=1)
              vperp=vel-dot[:,None]*zaxis
              phidrag=-srot[:,None]*vperp[:,:2]

              tlag=ti-LAG_US
              valid_lag=tlag>=ti[0]
              def delayed(phi):
                  out=np.empty_like(phi)
                  for ax in range(2):
                      out[:,ax]=np.interp(tlag,ti,phi[:,ax])
                  return phi-out
              d1=delayed(phi1); d2=delayed(phi2); doff=delayed(phioff)

              tl=np.asarray(land["timestamp"],dtype=np.int64)
              landed=prev(tl,np.asarray(land["landed"],dtype=bool),ti)
              finite=(~landed)&valid_lag&(dt>1e-5)&(dt<0.05)
              finite&=np.all(np.isfinite(y[:,:2]),axis=1)
              finite&=np.all(np.isfinite(phi1),axis=1)&np.all(np.isfinite(phidrag),axis=1)
              finite&=(np.linalg.norm(zaxis[:,:2],axis=1)>0.03)

              return {k:v[finite] for k,v in {
                  "y":y[:,:2],"phi1":phi1,"phi2":phi2,"phioff":phioff,
                  "d1":d1,"d2":d2,"doff":doff,"drag":phidrag,
              }.items()}

          data={p.stem:load(p) for p in root.glob("*.ulg")}

          def design(d,model):
              n=len(d["y"])
              cols=[]
              names=[]
              # axis-specific constant biases
              bN=np.zeros((2*n,)); bN[:n]=1
              bE=np.zeros((2*n,)); bE[n:]=1
              cols.extend([bN,bE]); names.extend(["bias_n","bias_e"])
              def stack(v): return np.r_[v[:,0],v[:,1]]
              if model=="linear":
                  cols += [stack(d["phi1"]),stack(d["d1"])]
                  names += ["steady_linear","dynamic_linear"]
              elif model=="quadratic_idle":
                  cols += [stack(d["phioff"]),stack(d["doff"])]
                  names += ["steady_quadratic_idle","dynamic_quadratic_idle"]
              elif model=="linear_quadratic":
                  cols += [stack(d["phi1"]),stack(d["phi2"]),stack(d["d1"]),stack(d["d2"])]
                  names += ["steady_linear","steady_quadratic","dynamic_linear","dynamic_quadratic"]
              elif model=="quadratic_idle_drag":
                  cols += [stack(d["phioff"]),stack(d["doff"]),stack(d["drag"])]
                  names += ["steady_quadratic_idle","dynamic_quadratic_idle","rotor_drag"]
              else:
                  raise ValueError(model)
              X=np.column_stack(cols)
              yy=np.r_[d["y"][:,0],d["y"][:,1]]
              return X,yy,names

          models=["linear","quadratic_idle","linear_quadratic","quadratic_idle_drag"]
          train=data["baseline_turn"]
          fitted={}
          for m in models:
              X,y,names=design(train,m)
              coef,*_=np.linalg.lstsq(X,y,rcond=None)
              fitted[m]=(coef,names)

          report={"fit_source":"baseline_turn_only","idle_normalized":IDLE,"models":{}}
          for m,(coef,names) in fitted.items():
              report["models"][m]={
                  "coefficients":{n:float(v) for n,v in zip(names,coef)},
                  "evaluation":{}
              }
              for case,d in sorted(data.items()):
                  X,y,_=design(d,m)
                  err=y-X@coef
                  n=len(d["y"])
                  e=np.column_stack([err[:n],err[n:]])
                  mag=np.linalg.norm(e,axis=1)
                  report["models"][m]["evaluation"][case]={
                      "samples":int(n),
                      "rmse_ne":float(np.sqrt(np.mean(np.sum(e*e,axis=1)))),
                      "mae_mag":float(np.mean(mag)),
                      "p95_mag":float(np.percentile(mag,95)),
                  }

          # Ratios vs current linear model on held-out richer maneuvers.
          report["ratios_vs_linear"]={}
          for case in ("accel_reverse","slalom","hard_turn"):
              base=report["models"]["linear"]["evaluation"][case]
              report["ratios_vs_linear"][case]={}
              for m in models[1:]:
                  cur=report["models"][m]["evaluation"][case]
                  report["ratios_vs_linear"][case][m]={
                      "rmse_ratio":cur["rmse_ne"]/base["rmse_ne"],
                      "p95_ratio":cur["p95_mag"]/base["p95_mag"],
                  }
          (root/"crossfit.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sad-actuator-mapping-crossfit
          path: build/sad_mapping_crossfit
          retention-days: 5
