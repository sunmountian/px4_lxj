name: Sensor Attack Detector V2 Smoke

concurrency:
  group: sad-v2-smoke-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - sad-v2-experiment
    paths:
      - '.github/workflows/sad_v2_smoke.yml'
      - 'Tools/sensor_attack_detector/run_v2_smoke.py'
      - 'Tools/sensor_attack_detector/calibrate_normal_priors.py'
      - 'Tools/sensor_attack_detector/tests/test_calibrate_normal_priors.py'
      - 'src/modules/sensor_attack_detector/**'
      - 'msg/sensor_attack_status.msg'

jobs:
  smoke:
    runs-on: ubuntu-latest
    container:
      image: px4io/px4-dev-simulation-focal:2021-09-08
      options: --privileged
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Prepare PX4 version metadata
        run: |
          set -eux
          git tag -f v1.13.0-0.0.1-dev HEAD
          git -C platforms/nuttx/NuttX/nuttx fetch --tags --force

      - name: Ensure Python experiment dependencies
        run: |
          set -eux
          python3 -m pip install --disable-pip-version-check pyulog pymavlink numpy

      - name: Build V2 PX4 and Gazebo plugins
        run: |
          set -eux
          make px4_sitl_default
          make px4_sitl_default sitl_gazebo

      - name: Bootstrap nominal smooth turns
        run: |
          set -eux
          for i in 1 2 3 4; do
            python3 Tools/sensor_attack_detector/run_v2_smoke.py \
              --scenario turn \
              --speed 1.3 \
              --turn-duration 6 \
              --straight-before 12 \
              --straight-after 20 \
              --normal-scale-sd 100 \
              --normal-dynamic-sd 100
          done

      - name: Calibrate development normal priors
        id: priors
        run: |
          set -eux
          mkdir -p build/sad_v2_smoke/calibration
          printf 'flight_id,scenario,nominal,ulog\n' \
            > build/sad_v2_smoke/calibration/prior_manifest.csv
          i=0
          for RESULT_JSON in $(find build/sad_v2_smoke -maxdepth 2 -path '*/turn_*/result.json' -type f | sort); do
            i=$((i + 1))
            ULOG="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ulog"])' "$RESULT_JSON")"
            printf 'bootstrap_turn_%d,turn,1,%s\n' "$i" "$ULOG" \
              >> build/sad_v2_smoke/calibration/prior_manifest.csv
          done
          test "$i" -eq 4
          python3 Tools/sensor_attack_detector/calibrate_normal_priors.py \
            --manifest build/sad_v2_smoke/calibration/prior_manifest.csv \
            --minimum-flights 4 \
            --output build/sad_v2_smoke/calibration/normal_priors.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          report = json.load(open("build/sad_v2_smoke/calibration/normal_priors.json"))
          p = report["candidate_parameters"]
          print(f"as_mu={p['SAD_AS_MU']}")
          print(f"as_sd={p['SAD_AS_SD']}")
          print(f"ad_mu={p['SAD_AD_MU']}")
          print(f"ad_sd={p['SAD_AD_SD']}")
          PY

      - name: Held-out nominal smooth turn
        run: |
          set -eux
          python3 Tools/sensor_attack_detector/run_v2_smoke.py \
            --scenario turn \
            --speed 1.3 \
            --turn-duration 6 \
            --straight-before 12 \
            --straight-after 20 \
            --normal-scale-mean "${{ steps.priors.outputs.as_mu }}" \
            --normal-scale-sd "${{ steps.priors.outputs.as_sd }}" \
            --normal-dynamic-mean "${{ steps.priors.outputs.ad_mu }}" \
            --normal-dynamic-sd "${{ steps.priors.outputs.ad_sd }}"

      - name: Primary 100m 20s PVA attack
        run: |
          set -eux
          python3 Tools/sensor_attack_detector/run_v2_smoke.py \
            --scenario pva-hover \
            --pva-north 100 \
            --pva-east 0 \
            --pva-ramp 20 \
            --pva-observation 8 \
            --normal-scale-mean "${{ steps.priors.outputs.as_mu }}" \
            --normal-scale-sd "${{ steps.priors.outputs.as_sd }}" \
            --normal-dynamic-mean "${{ steps.priors.outputs.ad_mu }}" \
            --normal-dynamic-sd "${{ steps.priors.outputs.ad_sd }}"

      - name: Collect smoke outputs
        if: always()
        run: |
          set -eux
          mkdir -p /tmp/sad_v2_smoke
          if [ -d build/sad_v2_smoke ]; then
            cp -a build/sad_v2_smoke /tmp/sad_v2_smoke/results
          fi
          if [ -d build/px4_sitl_default/tmp/rootfs/log ]; then
            cp -a build/px4_sitl_default/tmp/rootfs/log /tmp/sad_v2_smoke/ulog
          fi
          tar -czf /tmp/sad_v2_smoke.tar.gz -C /tmp sad_v2_smoke

      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sad-v2-smoke
          path: /tmp/sad_v2_smoke.tar.gz
          retention-days: 3
