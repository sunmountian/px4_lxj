name: Sensor Attack Detector Drag Proxy Crossfit

on:
  push:
    branches:
      - sad-v2-fixed-model
    paths:
      - '.github/workflows/sad_drag_proxy_crossfit.yml'

concurrency:
  group: sad-drag-proxy-crossfit
  cancel-in-progress: true

jobs:
  drag-proxy:
    runs-on: ubuntu-latest
    container:
      image: px4io/px4-dev-simulation-focal:2021-09-08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Prepare environment
        run: |
          set -eux
          git tag -f v1.13.0-0.0.1-dev HEAD
          git -C platforms/nuttx/NuttX/nuttx fetch --tags --force
          python3 -m pip install --disable-pip-version-check pyulog pymavlink numpy
          make px4_sitl_default
          make px4_sitl_default sitl_gazebo

      - name: Generate nominal ULogs
        run: |
          set -eux
          OUT=build/sad_drag_proxy
          mkdir -p "$OUT"
          COMMON="--normal-scale-mean -0.33720698952674866 --normal-scale-sd 0.02 --normal-dynamic-mean 0.42821773886680603 --normal-dynamic-sd 0.05 --weight-acceleration 142.17990926253765 --weight-velocity 71.20519081577794 --weight-position 50.66817247677383 --glrt-mean 4.309805243626817 --glrt-sd 6.958476444883066 --threshold 43.18242814116727"
          run_case () {
            LABEL="$1"; shift
            BEFORE=$(mktemp); AFTER=$(mktemp)
            find build/sad_v2_smoke -maxdepth 2 -name result.json -type f 2>/dev/null | sort > "$BEFORE" || true
            python3 Tools/sensor_attack_detector/run_v2_smoke.py "$@" $COMMON
            find build/sad_v2_smoke -maxdepth 2 -name result.json -type f | sort > "$AFTER"
            RESULT=$(comm -13 "$BEFORE" "$AFTER" | tail -n 1)
            test -n "$RESULT"
            ULOG=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ulog"])' "$RESULT")
            cp "$ULOG" "$OUT/${LABEL}.ulg"
            rm -f "$BEFORE" "$AFTER"
          }
          run_case baseline_turn --scenario turn --speed 1.3 --turn-duration 8 --straight-before 10 --straight-after 14
          run_case accel_reverse --scenario maneuver --maneuver accel --speed 2.2
          run_case slalom --scenario maneuver --maneuver slalom --speed 1.8
          run_case hard_turn --scenario maneuver --maneuver hard-turn --speed 2.2

      - name: Compare actual-velocity and trusted-setpoint drag proxies
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from pyulog import ULog

          root=Path("build/sad_drag_proxy")
          IDLE=0.1
          LAG_US=200000

          def ds(u,name):
              xs=[x for x in u.data_list if x.name==name and x.multi_id==0]
              if len(xs)!=1: raise RuntimeError(f"{name}[0]: {len(xs)}")
              return xs[0].data
          def prev(ts,vals,target):
              idx=np.searchsorted(ts,target,side="right")-1
              idx=np.clip(idx,0,len(ts)-1)
              return vals[idx]
          def interp(ts,vals,target): return np.interp(target,ts,vals)
          def Rq(q):
              w,x,y,z=q.T
              R=np.empty((len(q),3,3))
              R[:,0,0]=1-2*(y*y+z*z); R[:,0,1]=2*(x*y-w*z); R[:,0,2]=2*(x*z+w*y)
              R[:,1,0]=2*(x*y+w*z); R[:,1,1]=1-2*(x*x+z*z); R[:,1,2]=2*(y*z-w*x)
              R[:,2,0]=2*(x*z-w*y); R[:,2,1]=2*(y*z+w*x); R[:,2,2]=1-2*(x*x+y*y)
              return R

          def load(path):
              u=ULog(str(path),None,disable_str_exceptions=True)
              imu=ds(u,"vehicle_imu"); att=ds(u,"vehicle_attitude"); act=ds(u,"actuator_outputs")
              land=ds(u,"vehicle_land_detected"); lp=ds(u,"vehicle_local_position")
              tsp=ds(u,"trajectory_setpoint")

              ti=np.asarray(imu["timestamp_sample"],dtype=np.int64)
              dt=np.asarray(imu["delta_velocity_dt"],dtype=float)*1e-6
              dv=np.column_stack([np.asarray(imu[f"delta_velocity[{i}]"],dtype=float) for i in range(3)])
              ta=np.asarray(att["timestamp_sample"],dtype=np.int64)
              q=np.column_stack([interp(ta,np.asarray(att[f"q[{i}]"],dtype=float),ti) for i in range(4)])
              q=q/np.maximum(np.linalg.norm(q,axis=1)[:,None],1e-12)
              R=Rq(q); zaxis=R[:,:,2]
              y=np.einsum("nij,nj->ni",R,dv)/np.maximum(dt[:,None],1e-9)

              to=np.asarray(act["timestamp"],dtype=np.int64)
              outs=np.column_stack([np.asarray(act[f"output[{i}]"],dtype=float) for i in range(4)])
              un=np.clip((prev(to,outs,ti)-1000)/1000,0,1)
              soff=np.sum((un+IDLE)**2,axis=1)
              srot=np.sum(un+IDLE,axis=1)
              thrust=-zaxis[:,:2]*soff[:,None]

              tlag=ti-LAG_US
              valid_lag=tlag>=ti[0]
              dth=np.empty_like(thrust)
              for ax in range(2):
                  dth[:,ax]=thrust[:,ax]-np.interp(tlag,ti,thrust[:,ax])

              tlp=np.asarray(lp["timestamp_sample"],dtype=np.int64)
              vact=np.column_stack([interp(tlp,np.asarray(lp[k],dtype=float),ti) for k in ("vx","vy","vz")])

              ts=np.asarray(tsp["timestamp"],dtype=np.int64)
              vsp=np.column_stack([
                  prev(ts,np.asarray(tsp[k],dtype=float),ti)
                  for k in ("vx","vy","vz")
              ])
              # Invalid setpoint components are NaN outside the active velocity-controlled segment.
              vsp=np.where(np.isfinite(vsp),vsp,0.0)

              def drag(v):
                  dot=np.sum(v*zaxis,axis=1)
                  vp=v-dot[:,None]*zaxis
                  return -srot[:,None]*vp[:,:2]
              drag_actual=drag(vact)
              drag_sp=drag(vsp)

              tl=np.asarray(land["timestamp"],dtype=np.int64)
              landed=prev(tl,np.asarray(land["landed"],dtype=bool),ti)
              finite=(~landed)&valid_lag&(dt>1e-5)&(dt<0.05)
              finite&=np.all(np.isfinite(y[:,:2]),axis=1)
              finite&=np.all(np.isfinite(thrust),axis=1)&np.all(np.isfinite(drag_actual),axis=1)
              finite&=(np.linalg.norm(zaxis[:,:2],axis=1)>0.03)
              return {k:v[finite] for k,v in {"y":y[:,:2],"thrust":thrust,"dth":dth,
                      "drag_actual":drag_actual,"drag_sp":drag_sp}.items()}

          data={p.stem:load(p) for p in root.glob("*.ulg")}

          def design(d,mode):
              n=len(d["y"])
              def st(v): return np.r_[v[:,0],v[:,1]]
              bN=np.r_[np.ones(n),np.zeros(n)]
              bE=np.r_[np.zeros(n),np.ones(n)]
              cols=[bN,bE,st(d["thrust"]),st(d["dth"])]
              names=["bias_n","bias_e","thrust","dynamic"]
              if mode=="drag_actual":
                  cols.append(st(d["drag_actual"])); names.append("drag_actual")
              elif mode=="drag_setpoint":
                  cols.append(st(d["drag_sp"])); names.append("drag_setpoint")
              elif mode!="no_drag":
                  raise ValueError(mode)
              return np.column_stack(cols),np.r_[d["y"][:,0],d["y"][:,1]],names

          train=data["baseline_turn"]
          report={"fit_source":"baseline_turn_only","models":{}}
          for mode in ("no_drag","drag_actual","drag_setpoint"):
              X,y,names=design(train,mode)
              coef,*_=np.linalg.lstsq(X,y,rcond=None)
              report["models"][mode]={"coefficients":dict(zip(names,map(float,coef))),"evaluation":{}}
              for case,d in sorted(data.items()):
                  Xe,ye,_=design(d,mode)
                  err=ye-Xe@coef; n=len(d["y"])
                  e=np.column_stack([err[:n],err[n:]])
                  mag=np.linalg.norm(e,axis=1)
                  report["models"][mode]["evaluation"][case]={
                      "rmse_ne":float(np.sqrt(np.mean(np.sum(e*e,axis=1)))),
                      "p95_mag":float(np.percentile(mag,95)),
                  }
          report["heldout_ratios_vs_no_drag"]={}
          for case in ("accel_reverse","slalom","hard_turn"):
              base=report["models"]["no_drag"]["evaluation"][case]
              report["heldout_ratios_vs_no_drag"][case]={}
              for mode in ("drag_actual","drag_setpoint"):
                  cur=report["models"][mode]["evaluation"][case]
                  report["heldout_ratios_vs_no_drag"][case][mode]={
                      "rmse_ratio":cur["rmse_ne"]/base["rmse_ne"],
                      "p95_ratio":cur["p95_mag"]/base["p95_mag"],
                  }
          (root/"drag_proxy_crossfit.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sad-drag-proxy-crossfit
          path: build/sad_drag_proxy
          retention-days: 5
