name: Sensor Attack Detector Gain Robustness

on:
  push:
    branches:
      - sad-v2-fixed-model
    paths:
      - '.github/workflows/sad_v2_gain_robustness.yml'

concurrency:
  group: sad-v2-gain-robustness
  cancel-in-progress: true

jobs:
  gain-robustness:
    runs-on: ubuntu-latest
    container:
      image: px4io/px4-dev-simulation-focal:2021-09-08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Prepare environment
        run: |
          set -eux
          git tag -f v1.13.0-0.0.1-dev HEAD
          git -C platforms/nuttx/NuttX/nuttx fetch --tags --force
          python3 -m pip install --disable-pip-version-check pyulog pymavlink numpy
          make px4_sitl_default
          make px4_sitl_default sitl_gazebo

      - name: Run gain mismatch matrix
        run: |
          set -eux
          OUT=build/sad_v2_gain_robustness
          rm -rf build/sad_v2_smoke "$OUT"
          mkdir -p "$OUT"

          COMMON="--normal-scale-mean -0.33720698952674866             --normal-scale-sd 0.02             --normal-dynamic-mean 0.42821773886680603             --normal-dynamic-sd 0.05             --weight-acceleration 142.17990926253765             --weight-velocity 71.20519081577794             --weight-position 50.66817247677383             --glrt-mean 4.309805243626817             --glrt-sd 6.958476444883066             --threshold 43.18242814116727"

          run_turn () {
            LABEL="$1"; GAIN="$2"
            python3 Tools/sensor_attack_detector/run_v2_smoke.py               --scenario turn --speed 1.3 --turn-duration 8               --straight-before 10 --straight-after 14               --thr-gain "$GAIN" $COMMON
            RESULT=$(find build/sad_v2_smoke -maxdepth 2 -path '*/turn_*/result.json' -type f | sort | tail -n 1)
            cp "$RESULT" "$OUT/${LABEL}_turn.json"
          }

          run_attack () {
            LABEL="$1"; GAIN="$2"
            python3 Tools/sensor_attack_detector/run_v2_smoke.py               --scenario pva-hover --pva-north 100 --pva-east 0               --pva-ramp 20 --pva-observation 10               --thr-gain "$GAIN" $COMMON
            RESULT=$(find build/sad_v2_smoke -maxdepth 2 -path '*/pva-hover_*/result.json' -type f | sort | tail -n 1)
            cp "$RESULT" "$OUT/${LABEL}_attack.json"
          }

          run_turn gain_m20 2.776951984
          run_turn gain_m10 3.124070982
          run_turn gain_base 3.47118998
          run_turn gain_p10 3.818308978
          run_turn gain_p20 4.165427976
          run_attack gain_m10 3.124070982
          run_attack gain_p10 3.818308978

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("build/sad_v2_gain_robustness")
          rows=[]
          for p in sorted(root.glob("*.json")):
              if p.name=="summary.json":
                  continue
              r=json.load(open(p)); d=r["detector"]
              rows.append({
                  "case":p.stem,
                  "thr_gain":r["parameters"]["SAD_THR_GAIN"],
                  "alerts":d.get("alert_samples"),
                  "pre_attack_alerts":d.get("pre_attack_alert_count"),
                  "post_attack_alerts":d.get("post_attack_alert_count"),
                  "delay_s":d.get("first_alert_delay_s"),
                  "glrt_mean":d.get("glrt_mean"),
                  "glrt_max":d.get("glrt_max"),
                  "cusum_max":d.get("cusum_max"),
                  "cusum_margin":d.get("cusum_margin"),
                  "post_attack_glrt_mean":d.get("post_attack_glrt_mean"),
              })
          (root/"summary.json").write_text(json.dumps(rows,indent=2,sort_keys=True)+"\n")
          print(json.dumps(rows,indent=2,sort_keys=True))
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sad-v2-gain-robustness
          path: build/sad_v2_gain_robustness
          retention-days: 5
