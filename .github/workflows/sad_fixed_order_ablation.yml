name: Sensor Attack Detector Order Ablation

on:
  push:
    branches:
      - sad-v2-fixed-model
    paths:
      - '.github/workflows/sad_fixed_order_ablation.yml'

jobs:
  order-ablation:
    runs-on: ubuntu-latest
    container:
      image: px4io/px4-dev-simulation-focal:2021-09-08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Prepare environment
        run: |
          set -eux
          git tag -f v1.13.0-0.0.1-dev HEAD
          git -C platforms/nuttx/NuttX/nuttx fetch --tags --force
          python3 -m pip install --disable-pip-version-check pyulog pymavlink numpy
          make px4_sitl_default
          make px4_sitl_default sitl_gazebo

      - name: Run A versus VP ablation
        run: |
          set -eux
          OUT=build/sad_order_ablation
          mkdir -p "$OUT"
          BASE="--normal-scale-mean -0.33720698952674866 --normal-scale-sd 0.02 --normal-dynamic-mean 0.42821773886680603 --normal-dynamic-sd 0.05 --glrt-mean 0 --glrt-sd 1 --threshold 1000000 --cusum-drift 0.5 --consecutive 3"

          run_case () {
            LABEL="$1"; WA="$2"; WV="$3"; WP="$4"; shift 4
            MARKER=$(mktemp)
            touch "$MARKER"
            python3 Tools/sensor_attack_detector/run_v2_smoke.py "$@"               --weight-acceleration "$WA" --weight-velocity "$WV" --weight-position "$WP" $BASE
            RESULT=$(find build/sad_v2_smoke -maxdepth 2 -name result.json -type f -newer "$MARKER" | head -n 1)
            rm -f "$MARKER"
            test -n "$RESULT"
            cp "$RESULT" "$OUT/${LABEL}.json"
          }

          # Keep the retained order at its final calibrated weight and reduce
          # the disabled orders by eight orders of magnitude.
          EPS=0.000001
          WA=142.17990926253765
          WV=71.20519081577794
          WP=50.66817247677383

          run_case slalom_A  "$WA" "$EPS" "$EPS" --scenario maneuver --maneuver slalom --speed 1.8
          run_case slalom_VP "$EPS" "$WV" "$WP" --scenario maneuver --maneuver slalom --speed 1.8
          run_case hard_A    "$WA" "$EPS" "$EPS" --scenario maneuver --maneuver hard-turn --speed 2.2
          run_case hard_VP   "$EPS" "$WV" "$WP" --scenario maneuver --maneuver hard-turn --speed 2.2
          run_case attack_A  "$WA" "$EPS" "$EPS" --scenario pva-hover --pva-north 100 --pva-east 0 --pva-ramp 20 --pva-observation 10
          run_case attack_VP "$EPS" "$WV" "$WP" --scenario pva-hover --pva-north 100 --pva-east 0 --pva-ramp 20 --pva-observation 10

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("build/sad_order_ablation")
          rows=[]
          for p in sorted(root.glob("*.json")):
              if p.name=="summary.json":
                  continue
              r=json.load(open(p)); d=r["detector"]
              rows.append({
                  "case":p.stem,
                  "glrt_mean":d.get("glrt_mean"),
                  "glrt_p95":d.get("glrt_p95"),
                  "glrt_max":d.get("glrt_max"),
                  "pre_attack_glrt_mean":d.get("pre_attack_glrt_mean"),
                  "post_attack_glrt_mean":d.get("post_attack_glrt_mean"),
                  "post_attack_glrt_max":d.get("post_attack_glrt_max"),
              })
          (root/"summary.json").write_text(json.dumps(rows,indent=2)+"\n")
          print(json.dumps(rows,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sad-fixed-order-ablation
          path: build/sad_order_ablation
          retention-days: 5
